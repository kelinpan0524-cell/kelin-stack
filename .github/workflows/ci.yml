name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test skills/kelin-verify-stack/tests/core.test.mjs
      - run: node --test skills/kelin-verify-stack/tests/mode.test.mjs
      - run: node skills/kelin-verify-stack/scripts/offline-check.mjs
      - run: node skills/kelin-agents/scripts/agents-check.mjs AGENTS.md
