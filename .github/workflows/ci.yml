name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test $(find skills -name '*.test.mjs' | sort | tr '\n' ' ')
      - run: node skills/kelin-verify-stack/scripts/offline-check.mjs
      - run: node skills/kelin-evals/scripts/drift-check.mjs --root .
      - run: node skills/kelin-agents/scripts/agents-check.mjs AGENTS.md
      - run: node skills/kelin-guard/scripts/guard-check.mjs guards.json
      - name: ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="origin/${{ github.event.repository.default_branch || 'main' }}"
          fi
          if [ ! -f ratchet.json ] && git cat-file -e "${BASE_REF}:ratchet.json" 2>/dev/null; then
            echo "ratchet.json removed relative to ${BASE_REF}" >&2
            exit 1
          fi
          node skills/kelin-guard/scripts/ratchet-check.mjs ratchet.json --check --base-ref "$BASE_REF"
      - run: node skills/kelin-neat/scripts/neat-check.mjs neat.json
      - run: node skills/kelin-evals/scripts/skill-eval.mjs --root .
      - run: node skills/kelin-docs/scripts/gen-docs.mjs --check
      - run: node skills/kelin-mode/scripts/policy-check.mjs kelin-policy.json
