name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test $(find skills -name '*.test.mjs' | sort | tr '\n' ' ')
      - run: node skills/kelin-verify-stack/scripts/offline-check.mjs
      - run: node skills/kelin-evals/scripts/drift-check.mjs --root .
      - run: node skills/kelin-agents/scripts/agents-check.mjs AGENTS.md
      - run: node skills/kelin-guard/scripts/guard-check.mjs guards.json
      - run: node skills/kelin-guard/scripts/ratchet-check.mjs ratchet.json --check
      - run: node skills/kelin-neat/scripts/neat-check.mjs neat.json
      - run: node skills/kelin-evals/scripts/skill-eval.mjs --root .
      - run: node skills/kelin-docs/scripts/gen-docs.mjs --check
      - run: node skills/kelin-mode/scripts/policy-check.mjs kelin-policy.json
