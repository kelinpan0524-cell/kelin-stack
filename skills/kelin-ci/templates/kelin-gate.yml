name: kelin-gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests
        run: __TEST_COMMAND__
      - name: agents budget
        run: node .kelin/ci/agents-check.mjs AGENTS.md
      - name: feature map
        run: |
          if [ -f feature-map.json ]; then node .kelin/ci/map-check.mjs feature-map.json; else echo "no feature-map.json"; fi
      - name: acceptance
        run: |
          if [ -f verify.json ]; then node .kelin/ci/run-acceptance.mjs verify.json; else echo "no verify.json"; fi
      - name: guards
        run: |
          if [ -f guards.json ]; then node .kelin/ci/guard-check.mjs guards.json; else echo "no guards.json"; fi
      - name: ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="origin/${{ github.event.repository.default_branch || 'main' }}"
          fi
          if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_REF#origin/}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            echo "Unavailable ratchet base ref: ${BASE_REF}" >&2
            exit 1
          fi
          if [ ! -f ratchet.json ] && git cat-file -e "${BASE_REF}:ratchet.json" 2>/dev/null; then
            echo "ratchet.json removed relative to ${BASE_REF}" >&2
            exit 1
          fi
          if [ -f ratchet.json ]; then node .kelin/ci/ratchet-check.mjs ratchet.json --check --base-ref "$BASE_REF"; fi
